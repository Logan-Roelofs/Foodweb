name: Deploy live

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The Firestore/Storage emulators used by the rules tests need Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Test security rules
        run: npm run test:rules

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_UIDS: ${{ vars.VITE_ADMIN_UIDS }}
          VITE_USE_EMULATORS: 'false'

      # Skipped until the FIREBASE_PROJECT_ID repository variable exists,
      # so pushes before Firebase is set up still go green.
      - name: Authenticate to Google Cloud
        if: vars.FIREBASE_PROJECT_ID != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy hosting + Firestore rules/indexes + Storage rules
        if: vars.FIREBASE_PROJECT_ID != ''
        run: >
          npx firebase deploy
          --only hosting,firestore,storage
          --project "${{ vars.FIREBASE_PROJECT_ID }}"
          --non-interactive
          --force
